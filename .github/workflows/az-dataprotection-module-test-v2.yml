name: Az.DataProtection Module Test v2

"on":
  workflow_dispatch:
  push:
    branches:
      - naga/test-pr

# Matrix (9 jobs total):
#   ubuntu-latest  / pwsh           x Az 15.6.0, 15.5.0, 15.0.0
#   windows-latest / pwsh           x Az 15.6.0, 15.5.0, 15.0.0
#   windows-latest / powershell-5.1 x Az 15.6.0, 15.5.0, 15.0.0
#
# Flow: install pinned Az version -> diagnose (parse + unicode, informational) -> import -> validate
# Diagnosis is informational (continue-on-error). Import + validate ALWAYS run
# so we can see which shell/version combos actually break on import.

jobs:
  # =================================================================
  # Job 1 - PowerShell Core 7+ (ubuntu + windows)
  # =================================================================
  test-pwsh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        az-version: ['15.6.0', '15.5.0', '15.0.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    name: ${{ matrix.os }} / pwsh / Az ${{ matrix.az-version }}

    steps:
      - name: Report shell version
        shell: pwsh
        run: |
          Write-Host '============================================'
          Write-Host "Shell       : pwsh (PowerShell Core)"
          Write-Host "Edition     : $($PSVersionTable.PSEdition)"
          Write-Host "Version     : $($PSVersionTable.PSVersion)"
          Write-Host "OS          : $($PSVersionTable.OS)"
          Write-Host "Path        : $PSHOME"
          Write-Host "Az target   : ${{ matrix.az-version }}"
          Write-Host '============================================'

      - name: Bootstrap PowerShell gallery
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -eq 'Desktop') {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

      - name: Install Az ${{ matrix.az-version }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $azVersion = '${{ matrix.az-version }}'

          function Install-ModuleWithRetry {
            param(
              [Parameter(Mandatory)][string]$Name,
              [Parameter(Mandatory)][string]$Version
            )
            $maxAttempts = 3
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                Write-Host "Installing '$Name' v$Version (attempt $attempt/$maxAttempts)..."
                Install-Module -Name $Name -RequiredVersion $Version -Repository PSGallery -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
                Write-Host "Install succeeded."
                return
              } catch {
                if ($attempt -eq $maxAttempts) { throw }
                Write-Host "Retrying: $($_.Exception.Message)"
              }
            }
          }

          Install-ModuleWithRetry -Name Az -Version $azVersion

      - name: Report installed versions
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $azRollup = Get-Module -Name Az -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1
          $azDP = Get-Module -Name Az.DataProtection -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1
          $azAcct = Get-Module -Name Az.Accounts -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1

          $azRollupVer = if ($azRollup -and $azRollup.PSObject.Properties['Version']) { $azRollup.Version.ToString() } else { 'NOT FOUND' }
          $azDPVer     = if ($azDP -and $azDP.PSObject.Properties['Version']) { $azDP.Version.ToString() } else { 'NOT FOUND' }
          $azAcctVer   = if ($azAcct -and $azAcct.PSObject.Properties['Version']) { $azAcct.Version.ToString() } else { 'NOT FOUND' }
          $azDPPath    = if ($azDP -and $azDP.PSObject.Properties['ModuleBase']) { $azDP.ModuleBase } else { 'N/A' }

          Write-Host "Az rollup        : $azRollupVer"
          Write-Host "Az.DataProtection: $azDPVer"
          Write-Host "Az.Accounts      : $azAcctVer"
          Write-Host "Module path      : $azDPPath"

      # ---- DIAGNOSIS: informational, does NOT block import ----
      - name: Diagnose - parse all Az.DataProtection source files
        id: parse_check
        continue-on-error: true
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $module = Get-Module -Name Az.DataProtection -ListAvailable |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $module) { throw 'Az.DataProtection not found on disk.' }

          $files = @(Get-ChildItem -Path $module.ModuleBase -Recurse -Include '*.ps1','*.psm1' -File)
          Write-Host "Parsing $($files.Count) source files under $($module.ModuleBase)..."

          $parseErrors = @()
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) {
              foreach ($err in $errors) {
                $parseErrors += [pscustomobject]@{
                  File    = $file.FullName
                  Line    = $err.Extent.StartLineNumber
                  Message = $err.Message
                }
              }
            }
          }

          if ($parseErrors.Count -gt 0) {
            Write-Host ''
            Write-Host "PARSE ERRORS FOUND: $($parseErrors.Count)"
            Write-Host '--------------------------------------------'
            $parseErrors | Select-Object -First 30 | ForEach-Object {
              Write-Host "  $($_.File):$($_.Line)"
              Write-Host "    $($_.Message)"
            }
            throw "Az.DataProtection has $($parseErrors.Count) parse error(s) on pwsh $($PSVersionTable.PSVersion) with Az ${{ matrix.az-version }}."
          }

          Write-Host "All $($files.Count) files parsed successfully."

      - name: Diagnose - scan for Unicode corruption
        id: unicode_check
        continue-on-error: true
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $module = Get-Module -Name Az.DataProtection -ListAvailable |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $module) { throw 'Module not found on disk.' }

          $badChars = @{
            '\u2013' = 'en-dash (U+2013) - breaks -ne, -eq, -lt etc.'
            '\u2014' = 'em-dash (U+2014)'
            '\u2018' = 'left single smart quote (U+2018)'
            '\u2019' = 'right single smart quote (U+2019)'
            '\u201C' = 'left double smart quote (U+201C)'
            '\u201D' = 'right double smart quote (U+201D)'
          }

          $corrupted = @()
          $files = @(Get-ChildItem -Path $module.ModuleBase -Recurse -Include '*.ps1','*.psm1' -File)
          Write-Host "Scanning $($files.Count) files for Unicode corruption..."

          foreach ($file in $files) {
            $content = [System.IO.File]::ReadAllText($file.FullName)
            foreach ($pattern in $badChars.Keys) {
              $regex = [regex]$pattern
              if ($regex.IsMatch($content)) {
                $lines = $content.Split("`n")
                for ($i = 0; $i -lt $lines.Count; $i++) {
                  if ($regex.IsMatch($lines[$i])) {
                    $corrupted += "$($file.FullName):$($i+1) - $($badChars[$pattern])"
                  }
                }
              }
            }
          }

          if ($corrupted.Count -gt 0) {
            Write-Host ''
            Write-Host "UNICODE CORRUPTION FOUND: $($corrupted.Count) occurrence(s)"
            Write-Host '--------------------------------------------'
            $corrupted | ForEach-Object { Write-Host "  $_" }
            throw "Az.DataProtection has $($corrupted.Count) Unicode corruption(s) with Az ${{ matrix.az-version }}."
          }

          Write-Host "No Unicode corruption found."

      # ---- IMPORT + VALIDATE: always run to see what actually breaks ----
      - name: Import Az rollup (customer regression gate)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Write-Host 'Customer repro: Import-Module Az...'
          $importErrors = @()
          try {
            Import-Module Az -Force -ErrorAction Stop -ErrorVariable +importErrors
          } catch {
            Write-Host "Import-Module Az FAILED: $($_.Exception.Message)"
            throw
          }

          if ($importErrors.Count -gt 0) {
            Write-Host 'Non-terminating errors during Import-Module Az:'
            $importErrors | ForEach-Object { Write-Host "  - $_" }
            throw 'Regression: Import-Module Az produced errors.'
          }

          if (-not (Get-Module -Name Az)) {
            throw 'Regression: Az not loaded after Import-Module Az.'
          }

          Write-Host 'Import-Module Az succeeded without errors.'

      - name: Validate Az.DataProtection commands
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Import-Module Az.DataProtection -Force -ErrorAction Stop

          $commands = @(Get-Command -Module Az.DataProtection -ErrorAction Stop)
          if ($commands.Count -lt 10) {
            throw "Expected >= 10 commands, found $($commands.Count)."
          }

          $cmdlets   = @($commands | Where-Object CommandType -EQ 'Cmdlet')
          $functions = @($commands | Where-Object CommandType -EQ 'Function')
          Write-Host "Total: $($commands.Count) (cmdlets: $($cmdlets.Count), functions: $($functions.Count))"

          $required = @(
            'Get-AzDataProtectionBackupVault',
            'Get-AzDataProtectionBackupInstance',
            'Initialize-AzDataProtectionBackupInstance'
          )
          $missing = @()
          foreach ($name in $required) {
            $cmd = Get-Command -Module Az.DataProtection -Name $name -ErrorAction SilentlyContinue
            if ($cmd) { Write-Host "OK  $name" } else { $missing += $name }
          }
          if ($missing.Count -gt 0) { throw "Missing: $($missing -join ', ')" }

          $policyGet = @('Get-AzDataProtectionBackupPolicy','Get-AzDataProtectionPolicy') |
            ForEach-Object { Get-Command -Module Az.DataProtection -Name $_ -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $policyGet) { throw 'No policy Get command found.' }
          Write-Host "OK  $($policyGet.Name) (policy)"

          $allPolicy = @(Get-Command -Module Az.DataProtection -Name '*Policy*' -ErrorAction SilentlyContinue)
          if ($allPolicy.Count -lt 2) { throw "Expected >= 2 policy commands, found $($allPolicy.Count)." }

          $targets = @($required + $policyGet.Name | Select-Object -Unique)
          foreach ($name in $targets) {
            $cmd = Get-Command -Module Az.DataProtection -Name $name -ErrorAction SilentlyContinue
            if ($cmd -and $cmd.Parameters.Count -eq 0) { throw "$name has 0 parameters." }
          }

          Write-Host ''
          Write-Host 'All validations passed.'

  # =================================================================
  # Job 2 - Windows PowerShell 5.1 (customer's exact environment)
  # =================================================================
  test-powershell51:
    strategy:
      fail-fast: false
      matrix:
        az-version: ['15.6.0', '15.5.0', '15.0.0']
    runs-on: windows-latest
    timeout-minutes: 30
    name: windows-latest / powershell-5.1 / Az ${{ matrix.az-version }}

    steps:
      - name: Report shell version
        shell: powershell
        run: |
          Write-Host '============================================'
          Write-Host "Shell       : powershell (Windows PowerShell)"
          Write-Host "Edition     : $($PSVersionTable.PSEdition)"
          Write-Host "Version     : $($PSVersionTable.PSVersion)"
          Write-Host "Path        : $PSHOME"
          Write-Host "Az target   : ${{ matrix.az-version }}"
          Write-Host '============================================'

      - name: Bootstrap PowerShell gallery
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

      - name: Install Az ${{ matrix.az-version }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $azVersion = '${{ matrix.az-version }}'

          function Install-ModuleWithRetry {
            param(
              [Parameter(Mandatory=$true)][string]$Name,
              [Parameter(Mandatory=$true)][string]$Version
            )
            $maxAttempts = 3
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                Write-Host "Installing '$Name' v$Version (attempt $attempt/$maxAttempts)..."
                Install-Module -Name $Name -RequiredVersion $Version -Repository PSGallery -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
                Write-Host "Install succeeded."
                return
              } catch {
                if ($attempt -eq $maxAttempts) { throw }
                Write-Host "Retrying: $($_.Exception.Message)"
              }
            }
          }

          Install-ModuleWithRetry -Name Az -Version $azVersion

      - name: Report installed versions
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $azRollup = Get-Module -Name Az -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1
          $azDP = Get-Module -Name Az.DataProtection -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1
          $azAcct = Get-Module -Name Az.Accounts -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1

          $azRollupVer = if ($azRollup -and $azRollup.PSObject.Properties['Version']) { $azRollup.Version.ToString() } else { 'NOT FOUND' }
          $azDPVer     = if ($azDP -and $azDP.PSObject.Properties['Version']) { $azDP.Version.ToString() } else { 'NOT FOUND' }
          $azAcctVer   = if ($azAcct -and $azAcct.PSObject.Properties['Version']) { $azAcct.Version.ToString() } else { 'NOT FOUND' }
          $azDPPath    = if ($azDP -and $azDP.PSObject.Properties['ModuleBase']) { $azDP.ModuleBase } else { 'N/A' }

          Write-Host "Az rollup        : $azRollupVer"
          Write-Host "Az.DataProtection: $azDPVer"
          Write-Host "Az.Accounts      : $azAcctVer"
          Write-Host "Module path      : $azDPPath"

      # ---- DIAGNOSIS: informational, does NOT block import ----
      - name: Diagnose - parse all Az.DataProtection source files
        id: parse_check
        continue-on-error: true
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $module = Get-Module -Name Az.DataProtection -ListAvailable |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $module) { throw 'Az.DataProtection not found on disk.' }

          $files = @(Get-ChildItem -Path $module.ModuleBase -Recurse -Include '*.ps1','*.psm1' -File)
          Write-Host "Parsing $($files.Count) source files under $($module.ModuleBase)..."

          $parseErrors = @()
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) {
              foreach ($err in $errors) {
                $parseErrors += [pscustomobject]@{
                  File    = $file.FullName
                  Line    = $err.Extent.StartLineNumber
                  Message = $err.Message
                }
              }
            }
          }

          if ($parseErrors.Count -gt 0) {
            Write-Host ''
            Write-Host "PARSE ERRORS FOUND: $($parseErrors.Count)"
            Write-Host '--------------------------------------------'
            $parseErrors | Select-Object -First 30 | ForEach-Object {
              Write-Host "  $($_.File):$($_.Line)"
              Write-Host "    $($_.Message)"
            }
            throw "Az.DataProtection has $($parseErrors.Count) parse error(s) on PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition)) with Az ${{ matrix.az-version }}."
          }

          Write-Host "All $($files.Count) files parsed successfully."

      - name: Diagnose - scan for Unicode corruption
        id: unicode_check
        continue-on-error: true
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $module = Get-Module -Name Az.DataProtection -ListAvailable |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $module) { throw 'Module not found on disk.' }

          $badChars = @{
            '\u2013' = 'en-dash (U+2013) - breaks -ne, -eq, -lt etc.'
            '\u2014' = 'em-dash (U+2014)'
            '\u2018' = 'left single smart quote (U+2018)'
            '\u2019' = 'right single smart quote (U+2019)'
            '\u201C' = 'left double smart quote (U+201C)'
            '\u201D' = 'right double smart quote (U+201D)'
          }

          $corrupted = @()
          $files = @(Get-ChildItem -Path $module.ModuleBase -Recurse -Include '*.ps1','*.psm1' -File)
          Write-Host "Scanning $($files.Count) files for Unicode corruption..."

          foreach ($file in $files) {
            $content = [System.IO.File]::ReadAllText($file.FullName)
            foreach ($pattern in $badChars.Keys) {
              $regex = [regex]$pattern
              if ($regex.IsMatch($content)) {
                $lines = $content.Split("`n")
                for ($i = 0; $i -lt $lines.Count; $i++) {
                  if ($regex.IsMatch($lines[$i])) {
                    $corrupted += "$($file.FullName):$($i+1) - $($badChars[$pattern])"
                  }
                }
              }
            }
          }

          if ($corrupted.Count -gt 0) {
            Write-Host ''
            Write-Host "UNICODE CORRUPTION FOUND: $($corrupted.Count) occurrence(s)"
            Write-Host '--------------------------------------------'
            $corrupted | ForEach-Object { Write-Host "  $_" }
            throw "Az.DataProtection has $($corrupted.Count) Unicode corruption(s) with Az ${{ matrix.az-version }}."
          }

          Write-Host "No Unicode corruption found."

      # ---- IMPORT + VALIDATE: always run to see what actually breaks ----
      - name: Import Az rollup (customer regression gate)
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Write-Host 'Customer repro: Import-Module Az...'
          $importErrors = @()
          try {
            Import-Module Az -Force -ErrorAction Stop -ErrorVariable +importErrors
          } catch {
            Write-Host "Import-Module Az FAILED: $($_.Exception.Message)"
            throw
          }

          if ($importErrors.Count -gt 0) {
            Write-Host 'Non-terminating errors during Import-Module Az:'
            $importErrors | ForEach-Object { Write-Host "  - $_" }
            throw 'Regression: Import-Module Az produced errors.'
          }

          if (-not (Get-Module -Name Az)) {
            throw 'Regression: Az not loaded after Import-Module Az.'
          }

          Write-Host 'Import-Module Az succeeded without errors.'

      - name: Validate Az.DataProtection commands
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          Import-Module Az.DataProtection -Force -ErrorAction Stop

          $commands = @(Get-Command -Module Az.DataProtection -ErrorAction Stop)
          if ($commands.Count -lt 10) {
            throw "Expected >= 10 commands, found $($commands.Count)."
          }

          $cmdlets   = @($commands | Where-Object { $_.CommandType -eq 'Cmdlet' })
          $functions = @($commands | Where-Object { $_.CommandType -eq 'Function' })
          Write-Host "Total: $($commands.Count) (cmdlets: $($cmdlets.Count), functions: $($functions.Count))"

          $required = @(
            'Get-AzDataProtectionBackupVault',
            'Get-AzDataProtectionBackupInstance',
            'Initialize-AzDataProtectionBackupInstance'
          )
          $missing = @()
          foreach ($name in $required) {
            $cmd = Get-Command -Module Az.DataProtection -Name $name -ErrorAction SilentlyContinue
            if ($cmd) { Write-Host "OK  $name" } else { $missing += $name }
          }
          if ($missing.Count -gt 0) { throw "Missing: $($missing -join ', ')" }

          $policyGet = @('Get-AzDataProtectionBackupPolicy','Get-AzDataProtectionPolicy') |
            ForEach-Object { Get-Command -Module Az.DataProtection -Name $_ -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $policyGet) { throw 'No policy Get command found.' }
          Write-Host "OK  $($policyGet.Name) (policy)"

          $allPolicy = @(Get-Command -Module Az.DataProtection -Name '*Policy*' -ErrorAction SilentlyContinue)
          if ($allPolicy.Count -lt 2) { throw "Expected >= 2 policy commands, found $($allPolicy.Count)." }

          $targets = @($required + $policyGet.Name | Select-Object -Unique)
          foreach ($name in $targets) {
            $cmd = Get-Command -Module Az.DataProtection -Name $name -ErrorAction SilentlyContinue
            if ($cmd -and $cmd.Parameters.Count -eq 0) { throw "$name has 0 parameters." }
          }

          Write-Host ''
          Write-Host 'All validations passed.'
